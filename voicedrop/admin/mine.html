<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>挖文日志 · VoiceDrop</title>
<link rel="stylesheet" href="./theme.css"/>
<style>
/* two-pane layout (.panes/.list/.row/.detail) comes from theme.css */
.wrap{max-width:1320px;margin:0 auto;padding:22px 22px 60px}
.panes{grid-template-columns:380px 1fr}
.row:first-child{border-top:none}
.row .stem{flex:1;font-size:.83rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.row .ela{font-size:.72rem;color:var(--muted);flex:none;font-family:var(--fm)}

.detail .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line2)}
.detail .meta b{color:var(--ink);font-weight:600}
.audio-key{font-family:var(--fm);font-size:.76rem;color:var(--muted);
  word-break:break-all;margin-bottom:16px;background:var(--bg-sunk);padding:8px 11px;border-radius:8px;border:1px solid var(--line2)}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:0}
.ev{display:flex;align-items:baseline;gap:11px;padding:8px 0;border-top:1px solid var(--line2)}
.ev:first-child{border-top:none}
.ev .off{font-family:var(--fm);font-size:.74rem;color:var(--muted);flex:none;width:54px;text-align:right}
.ev .msg{flex:1;font-size:.88rem;color:var(--ink-2)}
.ev .data{font-family:var(--fm);font-size:.76rem;color:var(--muted);word-break:break-all;margin-top:2px}
.ev.key .msg{font-weight:700;color:var(--ink)}
.ev.warn .msg{color:var(--warn)}
.ev.ok .msg{color:var(--ok)}
.ev.bad .msg{color:var(--err)}
</style>
</head>
<body>

<div id="app" hidden>
  <div class="wrap">
    <div class="pagehead">
      <h1>挖文日志</h1>
      <span class="tag" id="count"></span>
      <span class="grow"></span>
      <div class="tools">
        <select id="date" title="按日期"></select>
      </div>
    </div>
    <div class="panes">
      <div class="list" id="list"></div>
      <div class="detail" id="detail"><div class="empty-state">选一条查看详细步骤</div></div>
    </div>
  </div>
</div>

<script src="/voicedrop/shared.js"></script>
<script src="./shell.js"></script>
<script src="./logviewer.js"></script>
<script>
// $ / esc from shared.js; appbar/gate/token from shell.js;
// date/list/fetch/select pipeline from logviewer.js — this page only renders.
const fmtTime = LogViewer.fmtTime;

function fmtElapsed(ms){ if(ms==null) return '—'; if(ms<1000) return `${ms}ms`; return `${(ms/1000).toFixed(1)}s`; }
function shortStem(stem){ return stem.replace(/^VoiceDrop-/,'').replace(/-[A-Za-z]+-[A-Za-z]+-[A-Za-z]+$/,''); }

function renderList(RECORDS){
  const list = $('#list');
  if(!RECORDS.length){ list.innerHTML=`<div class="empty-state">这一天没有挖文记录</div>`; $('#count').textContent=''; return; }
  $('#count').textContent=`${RECORDS.length} 条`;
  let html='';
  for(let i=0;i<RECORDS.length;i++){
    const r=RECORDS[i];
    const result = r.result||'error';
    const bCls = result==='mined'?'mined':result==='empty'?'empty':'error';
    const bTxt = result==='mined'?'成文':result==='empty'?'空':'错误';
    html+=`<div class="row" data-i="${i}">
      <span class="t">${esc(fmtTime(r.ts||0))}</span>
      <span class="stem" title="${esc(r.stem||r._key)}">${esc(shortStem(r.stem||''))}</span>
      <span class="ela">${esc(fmtElapsed(r.elapsed_ms))}</span>
      <span class="badge ${bCls}">${bTxt}</span>
    </div>`;
  }
  list.innerHTML=html;
  LogViewer.bindRows();
}

function evClass(msg){
  if(!msg) return '';
  if(msg.includes('完成')||msg.includes('写入')) return 'ok';
  if(msg.includes('错误')||msg.includes('失败')||msg.includes('空')) return 'bad';
  if(msg.includes('重试')) return 'warn';
  if(msg.includes('开始')||msg.includes('提交')) return 'key';
  return '';
}

function renderDetail(r){
  const d = $('#detail');
  if(!r){ d.innerHTML=`<div class="empty-state">—</div>`; return; }
  if(r._broken){ d.innerHTML=`<div class="errbox">读取失败：${esc(r._key)}</div>`; return; }

  const result = r.result||'error';
  const bCls = result==='mined'?'mined':result==='empty'?'empty':'error';
  const bTxt = result==='mined'?'✓ 成文':result==='empty'?'○ 空':'✗ 错误';

  let h = `<div class="meta">
    <span><b class="badge ${bCls}">${bTxt}</b></span>
    <span>耗时 <b>${esc(fmtElapsed(r.elapsed_ms))}</b></span>
    <span>${esc(new Date(r.ts).toLocaleString('zh-CN'))}</span>
  </div>
  <div class="audio-key">${esc(r.audioKey||r.stem||'')}</div>`;

  const events = r.events||[];
  if(!events.length){
    h += `<div class="empty-state" style="padding:30px 0">无事件记录</div>`;
  } else {
    h += `<div class="timeline">`;
    for(const ev of events){
      const off = r.ts ? ev.ts - r.ts : null;
      const offStr = off!=null ? `+${(off/1000).toFixed(1)}s` : '';
      const dataStr = ev.data!=null ? JSON.stringify(ev.data) : '';
      h += `<div class="ev ${esc(evClass(ev.msg))}">
        <span class="off">${esc(offStr)}</span>
        <div>
          <div class="msg">${esc(ev.msg)}</div>
          ${dataStr?`<div class="data">${esc(dataStr)}</div>`:''}
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  d.innerHTML = h;
  d.scrollTop = 0;
}

LogViewer.init({
  log: 'minelog',
  active: 'mine',
  title: '挖文日志',
  intro: '输入 master token 查看每次挖文的详细步骤。',
  emptyText: '还没有挖文日志',
  // newest first, by R2 key (key embeds the run timestamp)
  prepare: (rs)=> rs.sort((a,b)=> a._key<b._key?1:a._key>b._key?-1:0),
  renderList, renderDetail,
});
</script>
</body>
</html>
