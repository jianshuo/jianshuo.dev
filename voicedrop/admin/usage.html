<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>VoiceDrop · 算力账本</title>
<link rel="stylesheet" href="./theme.css"/>
<style>
.wrap{max-width:880px;margin:0 auto;padding:26px 22px 90px}
.sumline{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.tablecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
  overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{font-size:.74rem;color:var(--muted);font-weight:700;text-align:right;padding:12px 18px;
  background:var(--bg-soft);border-bottom:1px solid var(--line);letter-spacing:.02em}
thead th:first-child{text-align:left}
tbody td{padding:13px 18px;text-align:right;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;font-family:var(--fm);color:var(--ink);font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-sunk)}
.spent{color:var(--accent);font-weight:700}
.bal{color:var(--ok);font-weight:700}
</style>
</head>
<body>

<div id="app" hidden>
  <div class="wrap">
    <div class="pagehead">
      <h1>算力账本</h1>
      <span class="tag" id="updated"></span>
    </div>
    <div class="cards" id="cards"></div>
    <p class="sumline" id="sum"></p>
    <div id="tableWrap"></div>
  </div>
</div>

<script src="/voicedrop/shared.js"></script>
<script src="./shell.js"></script>
<script>
// $ / esc / el come from shared.js; appbar / gate / token from shell.js.

async function load(){
  $('#tableWrap').innerHTML = '<div class="empty-state"><span class="spin"></span> 读取中…</div>';
  $('#cards').innerHTML=''; $('#sum').textContent='';
  let accounts;
  try {
    const r = await fetch('https://jianshuo.dev/agent/usage/admin/accounts', { headers:{ Authorization:`Bearer ${VDAdmin.token()}` }});
    if(r.status===401 || r.status===403){ VDAdmin.logout('token 无效'); return; }
    if(!r.ok) throw new Error('加载失败 '+r.status);
    accounts = (await r.json()).accounts || [];
  } catch(e){
    $('#tableWrap').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`; return;
  }

  // biggest spenders first
  accounts.sort((a,b)=> (b.spent_suanli||0) - (a.spent_suanli||0));
  const totSpentY = accounts.reduce((s,a)=> s + (a.spent_yuan||0), 0);
  const totBal    = accounts.reduce((s,a)=> s + (a.balance_suanli||0), 0);

  $('#updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  const cards = [
    ['', accounts.length, '账户'],
    ['spent', '¥'+totSpentY.toFixed(2), '总消费'],
    ['bal', Math.round(totBal).toLocaleString(), '总余额(算力)'],
  ];
  for(const [c,n,l] of cards)
    $('#cards').append(el('div','card '+c, `<div class="n">${n}</div><div class="l">${l}</div>`));

  if(!accounts.length){ $('#tableWrap').innerHTML='<div class="empty-state">还没有账户。</div>'; return; }

  const rows = accounts.map(a=>{
    const who = a.user_sub.replace('users/anon-','').replace(/\/$/,'').slice(0,8).toUpperCase();
    return `<tr>
      <td>${esc(who)}</td>
      <td class="bal">${fmt(a.balance_suanli)}</td>
      <td>${fmt(a.granted_suanli)}</td>
      <td class="spent">${fmt(a.spent_suanli)}</td>
      <td>¥${(a.spent_yuan||0).toFixed(2)}</td>
    </tr>`;
  }).join('');
  $('#tableWrap').innerHTML = `<div class="tablecard"><table>
    <thead><tr><th>账户</th><th>余额(算力)</th><th>累计获得</th><th>累计消费</th><th>消费(¥)</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $('#sum').textContent = `共 ${accounts.length} 账户 · 累计消费 ¥${totSpentY.toFixed(2)}`;
}
function fmt(n){ return (n==null?0:n).toLocaleString(undefined,{maximumFractionDigits:1}); }

VDAdmin.init({
  active: 'usage',
  title: '算力账本',
  intro: '输入 master token 查看全量账户的算力消费。token 只存在本机浏览器，不上传。',
  onEnter: load,
});
</script>
</body>
</html>
