<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="喵喵队拯救世界 — 3 岁绘本：大雨冲走了小兔子的野餐，喵喵队出发救援！">
<title>喵喵队拯救世界 · 绘本</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#fdf3e3;font-family:'ZCOOL KuaiLe','PingFang SC',sans-serif;color:#5a4632;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
  .book{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:12px}
  .page{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .page.on{display:flex}
  .pic{width:100%;max-width:min(92vw,70dvh);aspect-ratio:1;border-radius:28px;box-shadow:0 14px 34px rgba(90,70,50,.22);object-fit:cover;background:#fff}
  .text{font-size:clamp(26px,7vw,34px);line-height:1.5;text-align:center;padding:0 18px;color:#6b5138}
  .cover h1{font-size:clamp(34px,9vw,48px);color:#e0703a;text-align:center;line-height:1.3;padding:0 16px}
  .cover .sub{font-size:18px;color:#a08764;margin-top:4px}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 4px}
  .btn{font-family:inherit;font-size:20px;color:#e0703a;background:#fff;border:none;border-radius:999px;padding:10px 26px;box-shadow:0 6px 16px rgba(90,70,50,.14);cursor:pointer}
  .btn:active{transform:scale(.94)}
  .btn.off{opacity:.3;pointer-events:none}
  .dots{display:flex;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#e6d3b8}
  .dots i.on{background:#e0703a}
  .end h1{font-size:clamp(40px,12vw,64px);color:#e0703a}
</style>
</head>
<body>
<div class="book" id="book">

  <section class="page cover on">
    <img class="pic" src="page-01.png" alt="封面">
    <h1>喵喵队拯救世界</h1>
    <div class="sub">3 岁绘本 · 13 页</div>
  </section>

  <section class="page"><img class="pic" src="page-01.png" alt=""><div class="text">森林里住着喵喵队。<br>喵喵队，大家好！</div></section>
  <section class="page"><img class="pic" src="page-02.png" alt=""><div class="text">下大雨了。<br>哗啦啦，哗啦啦。</div></section>
  <section class="page"><img class="pic" src="page-03.png" alt=""><div class="text">面包漂走了。<br>苹果滚走了。</div></section>
  <section class="page"><img class="pic" src="page-04.png" alt=""><div class="text">小兔子哭了。<br>哇——哇——</div></section>
  <section class="page"><img class="pic" src="page-05.png" alt=""><div class="text">咪咪说：<br>「喵喵队，出发！」</div></section>
  <section class="page"><img class="pic" src="page-06.png" alt=""><div class="text">雪球打开小背包。<br>捞到面包啦！</div></section>
  <section class="page"><img class="pic" src="page-07.png" alt=""><div class="text">豆豆蹬着小雨靴。<br>啪嗒啪嗒，追回苹果！</div></section>
  <section class="page"><img class="pic" src="page-08.png" alt=""><div class="text">咪咪用领巾擦一擦。<br>小兔子，不哭啦！</div></section>
  <section class="page"><img class="pic" src="page-09.png" alt=""><div class="text">小兔子笑了。<br>真开心，真开心！</div></section>
  <section class="page"><img class="pic" src="page-10.png" alt=""><div class="text">雨停啦！<br>太阳公公笑了！</div></section>
  <section class="page"><img class="pic" src="page-11.png" alt=""><div class="text">一起野餐，真香呀！<br>大家吃得好开心。</div></section>
  <section class="page"><img class="pic" src="page-12.png" alt=""><div class="text">喵喵队，到家啦！<br>热牛奶，暖暖喝！</div></section>
  <section class="page"><img class="pic" src="page-13.png" alt=""><div class="text">喵喵队，晚安！<br>世界又安全了。</div></section>

  <section class="page end">
    <img class="pic" src="page-13.png" alt="">
    <h1>完</h1>
    <div class="sub" style="font-size:18px;color:#a08764">喵喵队拯救世界 · jianshuo.dev/a</div>
  </section>

  <div class="bar">
    <button class="btn off" id="prev">← 上一页</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next">下一页 →</button>
  </div>
</div>
<script>
  const pages=[...document.querySelectorAll('.page')];
  const dots=document.getElementById('dots');
  let i=0;
  pages.forEach((_,k)=>{const d=document.createElement('i');if(k===0)d.className='on';dots.appendChild(d)});
  function show(n){
    i=Math.max(0,Math.min(pages.length-1,n));
    pages.forEach((p,k)=>p.classList.toggle('on',k===i));
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
    document.getElementById('prev').classList.toggle('off',i===0);
    document.getElementById('next').classList.toggle('off',i===pages.length-1);
  }
  document.getElementById('prev').onclick=()=>show(i-1);
  document.getElementById('next').onclick=()=>show(i+1);
  let sx=0;
  document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-40)show(i+1);if(dx>40)show(i-1)},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
</script>

</body>
</html>
